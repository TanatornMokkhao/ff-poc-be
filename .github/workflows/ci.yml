name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: docker build -t be-check .
      - name: The image starts
        run: |
          docker run -d --name be-check -p 3000:3000 be-check
          for i in $(seq 20); do curl -fs localhost:3000/health && break; sleep 1; done
          curl -fs localhost:3000/health
          docker exec be-check ls migrations

  # Expand / contract (MIGRATIONS.md): the rules hold, the migrations apply on top of the last
  # release's schema, and the last release still runs on the result, because a rollback does that.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Find the last release
        id: prev
        run: |
          prev=$(git tag -l 'prod/v*' --sort=-v:refname | head -1)
          [ -n "$prev" ] || prev=$(git tag -l 'staging/v*' --sort=-v:refname | head -1)
          [ -n "$prev" ] || { echo "::error::no release tag to compare with"; exit 1; }
          echo "ref=$prev" >> "$GITHUB_OUTPUT"
          echo "Comparing with $prev"

      - name: Rules
        run: BASE_REF="${{ steps.prev.outputs.ref }}" node scripts/check-migrations.mjs

      - name: Last release's schema, then this change's migrations
        env:
          PREV: ${{ steps.prev.outputs.ref }}
        run: |
          git worktree add ../prev "$PREV"
          if [ -f ../prev/migrate.js ]; then
            (cd ../prev && npm ci && node migrate.js)
          else
            echo "$PREV has no migrations; starting from an empty database"
          fi
          node migrate.js
          echo "Second run must apply nothing:"
          node migrate.js | tee second-run.log
          grep -q 'schema already current' second-run.log

      - name: The last release still runs on the new schema
        working-directory: ../prev
        run: |
          [ -d node_modules ] || npm ci
          PORT=3101 node index.js > ../prev.log 2>&1 &
          for i in $(seq 30); do curl -fs localhost:3101/health && break; sleep 1; done
          curl -fs localhost:3101/health
          if grep -q "'/notes'" server.js; then
            curl -fs -X POST localhost:3101/notes -d '{"body":"from the last release"}'
            curl -fs localhost:3101/notes | grep -q 'from the last release'
          fi
          kill %1

      - name: This change runs on the new schema
        run: |
          PORT=3102 node index.js > ../new.log 2>&1 &
          for i in $(seq 30); do curl -fs localhost:3102/health && break; sleep 1; done
          curl -fs -X POST localhost:3102/notes -d '{"body":"from this change","author":"ci"}'
          curl -fs localhost:3102/notes | grep -q 'from this change'
          kill %1

      - name: Server logs
        if: always()
        run: cat ../prev.log ../new.log 2>/dev/null || true
