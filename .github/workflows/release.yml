name: Release

# The hub tags this repo; people do not tag here.
#   staging/vX.Y.Z-rc.N  build the image once. If this commit already has an earlier rc,
#                        reuse that image instead of building again.
#   prod/vX.Y.Z          only on a commit that has a staging/vX.Y.Z-rc.N tag; retag that
#                        rc's image (no rebuild).
on:
  push:
    tags: ['staging/v*', 'prod/v*']

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/tanatornmokkhao/ff-poc-be

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the tag and find an earlier build of this commit
        id: v
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^staging/v([0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+)$ ]]; then
            STAGE=staging; VERSION="${BASH_REMATCH[1]}"
          elif [[ "$GITHUB_REF_NAME" =~ ^prod/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            STAGE=prod; VERSION="${BASH_REMATCH[1]}"
          else
            echo "Tag $GITHUB_REF_NAME must be staging/vX.Y.Z-rc.N or prod/vX.Y.Z"; exit 1
          fi
          # Earlier rc tags on this same commit (not this one), newest first.
          PREV=$(git tag --points-at "$GITHUB_SHA" | grep -E '^staging/v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' | grep -vx "$GITHUB_REF_NAME" | sort -V | tail -1 || true)
          if [ "$STAGE" = prod ]; then
            PREV=$(git tag --points-at "$GITHUB_SHA" | grep -E "^staging/v$VERSION-rc\.[0-9]+$" | sort -V | tail -1 || true)
            [ -n "$PREV" ] || { echo "No staging/v$VERSION-rc.N on this commit: it never went to staging."; exit 1; }
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "from=${PREV#staging/v}" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME: ${PREV:+reuse the image of $PREV}${PREV:-build a new image}"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push (first rc of this commit)
        if: ${{ steps.v.outputs.from == '' }}
        run: |
          docker build --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "$IMAGE:${{ steps.v.outputs.version }}" .
          docker push "$IMAGE:${{ steps.v.outputs.version }}"

      - name: Retag the image already built for this commit
        if: ${{ steps.v.outputs.from != '' }}
        run: docker buildx imagetools create -t "$IMAGE:${{ steps.v.outputs.version }}" "$IMAGE:${{ steps.v.outputs.from }}"

      - name: GitHub release
        run: |
          FLAG=$([ "${{ steps.v.outputs.stage }}" = staging ] && echo --prerelease || echo --latest)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then gh release edit "$GITHUB_REF_NAME" $FLAG
          else gh release create "$GITHUB_REF_NAME" --generate-notes $FLAG; fi
